# The locked server, beside the main one in the same container: its default user has a password
# (requirepass), so a connection that does not authenticate answers NOAUTH, and the single-argument
# AUTH <password> of servers before ACLs is what logs in.
bind 0.0.0.0
port 6381
protected-mode no
requirepass kr_default_pw
save ""
appendonly no
logfile /run/kr/locked.log

# TLS that requires a client certificate the test CA signed (tls-auth-clients yes, the servers' own default), for
# the client-certificate cases. The password rule holds over it too.
tls-port 6382
tls-cert-file /run/kr/certs/server.crt
tls-key-file /run/kr/certs/server.key
tls-ca-cert-file /run/kr/certs/ca.crt
tls-auth-clients yes

# The client certificate's CN. Where the server logs a certificate in as the user its CN names (start.sh), a
# connection that presents it is kr_cert without AUTH.
user kr_cert on >kr_cert_pw ~* &* +@all

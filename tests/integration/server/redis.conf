# The main integration server: plaintext, TLS beside it, a Unix socket, and one ACL user per authentication
# case. tools/redis.sh mounts this directory at /kr, and start.sh runs this file with the test PKI copied to
# /run/kr/certs. The syntax is the oldest server's in the matrix (Redis 6.2), which Valkey reads unchanged.
bind 0.0.0.0
port 6379
protected-mode no
unixsocket /run/kr/redis.sock
unixsocketperm 777

tls-port 6380
tls-cert-file /run/kr/certs/server.crt
tls-key-file /run/kr/certs/server.key
tls-ca-cert-file /run/kr/certs/ca.crt
# A client certificate is checked when one is sent, and not required.
tls-auth-clients optional

# Nothing is persisted: each container starts empty.
save ""
appendonly no

# A test picks the case by picking the user, as the PostgreSQL tests pick a role.
#   default    no password: a connection that never authenticates
#   kr_acl     AUTH <user> <password>, or HELLO 3 AUTH
#   kr_ro      read commands only, so a write answers NOPERM
#   kr_off     a disabled user, refused whatever the password
#   kr_nopass  any password is accepted
user default on nopass ~* &* +@all
user kr_acl on >kr_acl_pw ~* &* +@all
user kr_ro on >kr_ro_pw ~* &* -@all +@read +@connection
user kr_off off >kr_off_pw ~* &* +@all
user kr_nopass on nopass ~* &* +@all

# CI for @kama/redis. Copied in shape from @kama/postgres's workflow.
#
# Two jobs:
#   - unit: tools/test.sh, the hermetic program, debug and release, on linux-x64 and macos-arm64.
#   - integration: a real server per matrix entry via tools/redis.sh (docker on the Linux runner; macOS
#     runners have no container runtime). `tools/redis.sh smoke` first proves the server's configuration
#     with its own redis-cli, one check per authentication case and transport; then
#     tools/test-integration.sh runs the live suite (tests/integration), debug and release.
# Windows is not in the matrix; the package has never been built there.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-14, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Pinned rather than `latest`, so a compiler release cannot turn this repository red without a commit.
      # Raise it deliberately, in the same commit that raises the manifests' "kama" floor.
      - name: Install kama
        env:
          KAMA_VERSION: v0.9.573
        run: |
          curl -fsSL https://kama-lang.org/install.sh | sh
          echo "$HOME/.kama/bin" >> "$GITHUB_PATH"

      - name: Version
        run: kama --version

      - name: Unit tests
        run: tools/test.sh

  integration:
    name: integration (${{ matrix.server }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [redis-6.2, redis-7.2, redis-7.4, redis-8.2, redis-8.10, valkey-7.2, valkey-8.1, valkey-9.1]
    env:
      CONTAINER_RUNTIME: docker
    steps:
      - uses: actions/checkout@v5

      - name: Install kama
        env:
          KAMA_VERSION: v0.9.573
        run: |
          curl -fsSL https://kama-lang.org/install.sh | sh
          echo "$HOME/.kama/bin" >> "$GITHUB_PATH"

      - name: Start ${{ matrix.server }}
        run: tools/redis.sh up --server ${{ matrix.server }}

      - name: Server smoke (one check per authentication case and transport)
        run: tools/redis.sh smoke --server ${{ matrix.server }}

      - name: Integration tests (debug and release)
        run: tools/test-integration.sh --server ${{ matrix.server }}

      - name: Server log on failure
        if: failure()
        run: tools/redis.sh logs --server ${{ matrix.server }} || true

      - name: Stop ${{ matrix.server }}
        if: always()
        run: tools/redis.sh down --server ${{ matrix.server }}
